<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lavagna a quadretti che riconosce i conti scritti a mano: variabili, frazioni, esponenti e parentesi.">
<meta name="theme-color" content="#FAF7F1">
<title>Quadretti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Caveat:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#FAF7F1;
  --surface:#FFFFFF;
  --grid:#DEE6EE;
  --grid-2:#C7D5E4;
  --margin-line:#E7BDB6;
  --c-ink:#1B3B72;
  --c-red:#BE3A2B;
  --c-green:#2E7A58;
  --c-amber:#C9922A;
  --c-violet:#6B4A9E;
  --c-teal:#17708C;
  --text:#232C3A;
  --muted:#6B778A;
  --line:#E5E0D5;
  --btn:#F2EFE7;
  --btn-hover:#E8E3D7;
  --accent:#1B3B72;
  --accent-ink:#FFFFFF;
  --shadow:0 1px 1px rgba(26,34,50,.05), 0 8px 24px rgba(26,34,50,.08);
  --shadow-soft:0 1px 2px rgba(26,34,50,.06);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    color-scheme: dark;
    --paper:#141C1A;
    --surface:#1B2523;
    --grid:#23302C;
    --grid-2:#2E3F3A;
    --margin-line:transparent;
    --c-ink:#EDE7DA;
    --c-red:#F0795A;
    --c-green:#79C79C;
    --c-amber:#E7C25F;
    --c-violet:#B49BE4;
    --c-teal:#6FC3D8;
    --text:#DCE4DF;
    --muted:#8DA09A;
    --line:#26332F;
    --btn:#222E2B;
    --btn-hover:#2B3A36;
    --accent:#EDE7DA;
    --accent-ink:#141C1A;
    --shadow:0 1px 1px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --shadow-soft:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#141C1A;
  --surface:#1B2523;
  --grid:#23302C;
  --grid-2:#2E3F3A;
  --margin-line:transparent;
  --c-ink:#EDE7DA;
  --c-red:#F0795A;
  --c-green:#79C79C;
  --c-amber:#E7C25F;
  --c-violet:#B49BE4;
  --c-teal:#6FC3D8;
  --text:#DCE4DF;
  --muted:#8DA09A;
  --line:#26332F;
  --btn:#222E2B;
  --btn-hover:#2B3A36;
  --accent:#EDE7DA;
  --accent-ink:#141C1A;
  --shadow:0 1px 1px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --shadow-soft:0 1px 2px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0; background:var(--paper); color:var(--text);
  font-family:"Archivo","Segoe UI",system-ui,sans-serif;
  height:100dvh; overflow:hidden;
  display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}

/* ---------- top bar ---------- */
.topbar{
  flex:0 0 auto; display:flex; align-items:center; gap:14px;
  padding:10px 14px; border-bottom:1px solid var(--line);
  background:var(--surface);
}
.brand{display:flex; align-items:baseline; gap:9px; min-width:0}
.brand h1{margin:0; font-size:19px; font-weight:700; letter-spacing:-.015em}
.brand .sub{
  font-size:11.5px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.spacer{flex:1 1 auto}
.tb-actions{display:flex; align-items:center; gap:6px}
.tbtn{
  display:inline-flex; align-items:center; gap:7px;
  padding:7px 11px; border-radius:8px; background:var(--btn);
  font-size:13px; font-weight:500; white-space:nowrap;
}
.tbtn:hover{background:var(--btn-hover)}
.tbtn svg{width:15px;height:15px;flex:0 0 auto}
.tbtn.primary{background:var(--accent); color:var(--accent-ink); font-weight:600}
.tbtn.primary:hover{filter:brightness(1.08)}
.toggle{
  display:inline-flex; align-items:center; gap:8px; padding:6px 11px 6px 8px;
  border-radius:999px; background:var(--btn); font-size:12.5px; color:var(--muted);
}
.toggle .dot{
  width:30px; height:17px; border-radius:999px; background:var(--line);
  position:relative; transition:background .16s;
}
.toggle .dot::after{
  content:""; position:absolute; top:2px; left:2px; width:13px; height:13px;
  border-radius:50%; background:var(--surface); box-shadow:var(--shadow-soft);
  transition:transform .16s;
}
.toggle[aria-pressed="true"]{color:var(--text)}
.toggle[aria-pressed="true"] .dot{background:var(--c-green)}
.toggle[aria-pressed="true"] .dot::after{transform:translateX(13px)}

/* ---------- work area ---------- */
.work{flex:1 1 auto; display:flex; min-height:0}

.rail{
  flex:0 0 auto; width:64px; padding:10px 0 12px; display:flex; flex-direction:column;
  align-items:center; gap:4px; border-right:1px solid var(--line); background:var(--surface);
}
.rail .tool{
  width:44px; height:44px; border-radius:11px; display:grid; place-items:center;
  color:var(--muted);
}
.rail .tool:hover{background:var(--btn); color:var(--text)}
.rail .tool[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.rail .tool svg{width:21px;height:21px}
.rail .sep{width:28px; height:1px; background:var(--line); margin:9px 0}
.rail .cap{
  font-size:9px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); margin-bottom:6px;
}
.swatches{display:grid; grid-template-columns:repeat(2,1fr); gap:7px; padding:0 12px}
.sw{width:22px;height:22px;border-radius:50%; border:2px solid transparent; position:relative}
.sw i{position:absolute; inset:2px; border-radius:50%; background:var(--sc)}
.sw:hover i{inset:1px}
.sw[aria-pressed="true"]{border-color:var(--sc)}
.sizes{display:flex; flex-direction:column; align-items:center; gap:5px}
.sz{width:30px;height:24px;border-radius:7px; display:grid;place-items:center}
.sz i{display:block; border-radius:999px; background:var(--muted)}
.sz:hover{background:var(--btn)}
.sz[aria-pressed="true"]{background:var(--btn-hover)}
.sz[aria-pressed="true"] i{background:var(--text)}

/* ---------- board ---------- */
.board{
  flex:1 1 auto; position:relative; min-width:0; overflow:hidden;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(var(--grid-2) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-2) 1px, transparent 1px);
  background-size:24px 24px, 24px 24px, 120px 120px, 120px 120px;
  touch-action:none;
}
.board::before{
  content:""; position:absolute; top:0; bottom:0; left:72px; width:1px;
  background:var(--margin-line); pointer-events:none;
}
#cv{
  position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair;
  touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
body.tool-eraser #cv{cursor:cell}

.hint{
  position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
  display:block; max-width:min(90%, 620px); padding:7px 14px; border-radius:999px;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  border:1px solid var(--line); box-shadow:var(--shadow-soft);
  font-size:12.5px; color:var(--muted); pointer-events:none;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.hint code + code{margin-left:2px}
.hint b{color:var(--text); font-weight:600}
.hint code{font-family:"DM Mono",monospace; font-size:12px; color:var(--c-ink)}

.toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
  background:var(--accent); color:var(--accent-ink); font-size:13px; font-weight:500;
  padding:9px 16px; border-radius:999px; box-shadow:var(--shadow); z-index:9;
  opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;
}
.toast.on{opacity:1; transform:translateX(-50%) translateY(-4px)}

@media (max-width:620px){
  .tb-actions .label{display:none}
  .brand .sub{display:none}
  .brand h1{font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .topbar{gap:8px; padding:8px 10px}
  .tbtn{padding:9px 10px}
  .rail{width:54px}
  .rail .tool{width:40px;height:40px}
  .rail .cap{display:none}
  .hint{font-size:11.5px; padding:5px 11px; bottom:10px; max-width:calc(100% - 20px)}
}
@media (max-width:470px){
  .brand{display:none}
  .tb-actions{flex:1 1 auto; justify-content:space-between; gap:4px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important; animation:none !important}
}
</style>

<header class="topbar">
  <div class="brand">
    <h1>Quadretti</h1>
    <span class="sub">lavagna che corregge i conti</span>
  </div>
  <div class="spacer"></div>
  <div class="tb-actions">
    <button class="toggle" id="autoBtn" aria-pressed="true" title="Risolvi da solo dopo una pausa">
      <span class="dot"></span><span class="label">Auto</span>
    </button>
    <button class="tbtn" id="undoBtn" title="Annulla (Ctrl+Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3.5 13a9 9 0 1 0 2.3-9.3L3 7"/></svg>
      <span class="label">Annulla</span>
    </button>
    <button class="tbtn" id="redoBtn" title="Rifai (Ctrl+Shift+Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M20.5 13a9 9 0 1 1-2.3-9.3L21 7"/></svg>
      <span class="label">Rifai</span>
    </button>
    <button class="tbtn" id="exportBtn" hidden title="Scarica la lavagna in PNG">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/></svg>
      <span class="label">PNG</span>
    </button>
    <button class="tbtn primary" id="solveBtn" title="Riconosci e risolvi (Ctrl+Invio)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14"/><path d="M5 15h14"/><path d="M15 4 9 20"/></svg>
      Risolvi
    </button>
  </div>
</header>

<div class="work">
  <nav class="rail" aria-label="Strumenti">
    <button class="tool" data-tool="pen" aria-pressed="true" title="Penna (P)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4.5 1.5L5 15z"/><path d="m14.5 5.5 3 3"/></svg>
    </button>
    <button class="tool" data-tool="hl" aria-pressed="false" title="Evidenziatore (H)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4.5 19.5 10l-7 7H7l-1.5-3z"/><path d="M4 20.5h9"/><path d="m11.5 7 5.5 5.5"/></svg>
    </button>
    <button class="tool" data-tool="eraser" aria-pressed="false" title="Gomma (G)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 16.5 6.5-6.5 6 6-3.5 3.5H7z"/><path d="m10.5 10 4-4a1.8 1.8 0 0 1 2.5 0l3.5 3.5a1.8 1.8 0 0 1 0 2.5l-4 4"/><path d="M9 20h11"/></svg>
    </button>
    <div class="sep"></div>
    <div class="cap">Colori</div>
    <div class="swatches">
      <button class="sw" data-color="ink" aria-pressed="true" style="--sc:var(--c-ink)" title="Inchiostro"><i></i></button>
      <button class="sw" data-color="red" aria-pressed="false" style="--sc:var(--c-red)" title="Rosso"><i></i></button>
      <button class="sw" data-color="green" aria-pressed="false" style="--sc:var(--c-green)" title="Verde"><i></i></button>
      <button class="sw" data-color="amber" aria-pressed="false" style="--sc:var(--c-amber)" title="Giallo"><i></i></button>
      <button class="sw" data-color="violet" aria-pressed="false" style="--sc:var(--c-violet)" title="Viola"><i></i></button>
      <button class="sw" data-color="teal" aria-pressed="false" style="--sc:var(--c-teal)" title="Ottanio"><i></i></button>
    </div>
    <div class="sep"></div>
    <div class="cap">Tratto</div>
    <div class="sizes">
      <button class="sz" data-size="1.8" aria-pressed="false" title="Sottile"><i style="width:14px;height:2px"></i></button>
      <button class="sz" data-size="3" aria-pressed="true" title="Medio"><i style="width:16px;height:4px"></i></button>
      <button class="sz" data-size="5" aria-pressed="false" title="Grosso"><i style="width:18px;height:7px"></i></button>
    </div>
    <div class="spacer"></div>
    <button class="tool" id="clearBtn" title="Svuota la lavagna">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14"/><path d="M9 7V5h6v2"/><path d="M7 7v12h10V7"/><path d="M10.5 10.5v5M13.5 10.5v5"/></svg>
    </button>
  </nav>

  <div class="board" id="board">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint">Chiudi il conto con <code>=</code> e <b>il risultato arriva in rosso</b> &middot; valgono anche <code>x = 2</code>, frazioni e potenze</div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
var $ = function(s){ return document.querySelector(s); };
var board = $('#board'), cv = $('#cv'), ctx = cv.getContext('2d');
var toastEl = $('#toast'), hintEl = $('#hint');
var uidc = 1; function nid(){ return 'i' + (uidc++); }

var S = { strokes:[], answers:[], tool:'pen', color:'ink', size:3, auto:true };

/* ---------------- palette ---------------- */
var PAL = {};
function readPalette(){
  var cs = getComputedStyle(document.documentElement);
  function v(n, f){ var x = cs.getPropertyValue(n).trim(); return x || f; }
  PAL = {
    ink:v('--c-ink','#1B3B72'), red:v('--c-red','#BE3A2B'),
    green:v('--c-green','#2E7A58'), amber:v('--c-amber','#AC7415'),
    paper:v('--paper','#FAF7F1'), grid:v('--grid','#DEE6EE'),
    grid2:v('--grid-2','#C7D5E4'), line:v('--line','#E5E0D5'),
    surface:v('--surface','#ffffff'), muted:v('--muted','#6B778A')
  };
}
readPalette();
if(window.matchMedia){
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ readPalette(); cacheDirty=true; render(); });
}
new MutationObserver(function(){ readPalette(); cacheDirty=true; render(); })
  .observe(document.documentElement, {attributes:true, attributeFilter:['data-theme','style','class']});

/* ---------------- canvas ---------------- */
var W=0, H=0, DPR=1;
var cache = document.createElement('canvas'), cctx = cache.getContext('2d'), cacheDirty = true;

function resize(){
  var r = board.getBoundingClientRect();
  if(!r.width || !r.height) return;
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = r.width; H = r.height;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cacheDirty = true; render();
}
new ResizeObserver(resize).observe(board);

function drawStroke(g, st){
  var p = st.pts; if(!p.length) return;
  g.save();
  g.strokeStyle = PAL[st.color] || PAL.ink; g.fillStyle = g.strokeStyle;
  g.lineWidth = st.w; g.lineJoin = 'round';
  if(st.hl){ g.globalAlpha = 0.28; g.lineCap = 'square'; } else { g.lineCap = 'round'; }
  if(p.length < 2){
    g.beginPath(); g.arc(p[0].x, p[0].y, Math.max(0.9, st.w/2), 0, 6.2832); g.fill(); g.restore(); return;
  }
  g.beginPath(); g.moveTo(p[0].x, p[0].y);
  for(var i=1;i<p.length-1;i++){
    g.quadraticCurveTo(p[i].x, p[i].y, (p[i].x+p[i+1].x)/2, (p[i].y+p[i+1].y)/2);
  }
  g.lineTo(p[p.length-1].x, p[p.length-1].y);
  g.stroke();
  g.restore();
}
function drawCheck(g,x,base,h,color){
  g.strokeStyle=color; g.lineWidth=Math.max(1.6,h*0.13); g.lineCap='round'; g.lineJoin='round';
  g.beginPath(); g.moveTo(x, base-h*0.42); g.lineTo(x+h*0.32, base); g.lineTo(x+h*0.92, base-h*0.98); g.stroke();
}
function drawCross(g,x,base,h,color){
  g.strokeStyle=color; g.lineWidth=Math.max(1.6,h*0.13); g.lineCap='round';
  var s=h*0.6, top=base-s;
  g.beginPath(); g.moveTo(x,top); g.lineTo(x+s,base); g.moveTo(x+s,top); g.lineTo(x,base); g.stroke();
}
function drawAnswer(g,a){
  g.save();
  if(a.mark==='ok'){ drawCheck(g, a.x, a.baseline, a.h, PAL.green); g.restore(); return; }
  var x = a.x;
  if(a.mark==='bad'){ drawCross(g, x, a.baseline, a.h, PAL.red); x += a.h*0.9; }
  g.fillStyle = PAL.red; g.textBaseline = 'alphabetic';
  g.font = '700 ' + a.size + 'px Caveat, "Segoe Script", cursive';
  g.fillText(a.text, x, a.baseline);
  g.restore();
}
function rebuildCache(){
  cache.width = cv.width; cache.height = cv.height;
  cctx.setTransform(DPR,0,0,DPR,0,0); cctx.clearRect(0,0,W,H);
  for(var pass=0; pass<2; pass++){
    for(var i=0;i<S.strokes.length;i++){
      var st = S.strokes[i];
      if(drawing && st.id === drawing.id) continue;
      if(pass === 0 && !st.hl) continue;
      if(pass === 1 && st.hl) continue;
      drawStroke(cctx, st);
    }
  }
  for(var j=0;j<S.answers.length;j++) drawAnswer(cctx, S.answers[j]);
  cacheDirty = false;
}
function render(){
  if(!W) return;
  if(cacheDirty) rebuildCache();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(cache,0,0);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(drawing) drawStroke(ctx, drawing);
}

/* ---------------- history ---------------- */
var hist=[], fut=[];
function snap(){ return JSON.stringify({s:S.strokes, a:S.answers}); }
function pushHistory(){ hist.push(snap()); if(hist.length>60) hist.shift(); fut.length=0; }
function applySnap(json){
  var d = JSON.parse(json);
  S.strokes = d.s || []; S.answers = d.a || [];
  cacheDirty = true; render(); save();
}
function undo(){ if(!hist.length) return; fut.push(snap()); applySnap(hist.pop()); }
function redo(){ if(!fut.length) return; hist.push(snap()); applySnap(fut.pop()); }

/* ---------------- storage ---------------- */
var saveT=0;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(function(){
    try{ localStorage.setItem('quadretti.v1', snap()); }catch(e){}
  }, 400);
}
function load(){
  try{
    var j = localStorage.getItem('quadretti.v1');
    if(!j) return false;
    var d = JSON.parse(j);
    if(!d) return false;
    S.strokes = d.s || []; S.answers = d.a || [];
    var mx = 1;
    S.strokes.forEach(function(o){
      var m = /^i(\d+)$/.exec(o.id || ''); if(m) mx = Math.max(mx, (+m[1]) + 1);
    });
    uidc = mx;
    return S.strokes.length > 0;
  }catch(e){ return false; }
}

/* ---------------- pointer input ---------------- */
var drawing=null, erasing=false, lastPt=null;
function pos(e){ var r = cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }

board.addEventListener('pointerdown', function(e){
  if(e.target !== cv) return;
  if(e.pointerType==='mouse' && e.button!==0) return;
  if(e.isPrimary === false) return;  /* a second finger must not hijack the stroke */
  if(drawing || erasing) endDraw();  /* a lost pointerup must not block the next stroke */
  e.preventDefault();
  var p = pos(e);
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  if(S.tool==='eraser'){ pushHistory(); erasing = true; eraseAt(p); return; }
  pushHistory();
  var hl = S.tool === 'hl' ? 1 : 0;
  drawing = {id:nid(), color:S.color, w:hl ? S.size*6.5 : S.size, hl:hl, pts:[p]};
  S.strokes.push(drawing); lastPt = p;
  render();
});
board.addEventListener('pointermove', function(e){
  if(erasing){ eraseAt(pos(e)); return; }
  if(!drawing) return;
  var evs = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
  for(var i=0;i<evs.length;i++){
    var p = pos(evs[i]);

  for(var i=0;i<list.length;i++){
    var s = list[i];
    if(s.frac){ leafBoxes(s.num, out); leafBoxes(s.den, out); }
    else out.push(s.b);
  }
  return out;
}
function refHeight(list){
  var hs = leafBoxes(list).map(function(b){ return b.h; }).sort(function(a,b){ return a-b; });
  if(!hs.length) return 12;
  var mx = hs[hs.length-1];
  var tall = hs.filter(function(h){ return h > mx*0.45; });
  return Math.max(6, tall.length ? tall[Math.floor(tall.length/2)] : mx);
}
function boxHeights(list){
  var hs = list.map(function(o){ return o.b.h; }).sort(function(a,b){ return a-b; });
  if(!hs.length) return 12;
  var mx = hs[hs.length-1];
  var tall = hs.filter(function(h){ return h > mx*0.45; });

/* writing directly above AND below a mark, aligned with it: that is a fraction bar */
function sandwiched(it, rowH, items){

    if(c < it.b.x || c > it.b.x2) continue;
    var gUp = it.b.y - o.b.y2, gDn = o.b.y - it.b.y2;

      var lim = 2.2*Math.max(rowH, it.b.h);
      if(it.b.x - L.x2 > lim || L.x - it.b.x2 > lim) continue;
      var ov = Math.min(it.b.y2, L.y2) - Math.max(it.b.y, L.y);

  rows.forEach(function(L){ L.items.sort(function(a,b){ return a.b.x - b.b.x; }); });

function isFlatBox(b){ return b.w > 1.9*Math.max(1, b.h); }

/* two short bars stacked on top of each other are an "=", even when the hand

  for(var i=0;i<syms.length;i++){
    var a = syms[i];

    for(var j=i+1;j<syms.length;j++){
      var b = syms[j];
      if(!flatSym(b, refH)) continue;
      var ovx = Math.min(a.b.x2, b.b.x2) - Math.max(a.b.x, b.b.x);
      if(ovx < 0.25*Math.min(a.b.w, b.b.w)) continue;
      var dy = Math.abs((a.b.y + a.b.y2)/2 - (b.b.y + b.b.y2)/2);
      if(dy < 0.04*refH || dy > 0.6*refH) continue;
      if(Math.max(a.b.w, b.b.w) > 2.4*Math.min(a.b.w, b.b.w)) continue;
      a.items = a.items.concat(b.items);

/* strokes of one symbol overlap horizontally and either overlap vertically or are

function assembleSymbols(items, refH){

    for(var i=0;i<syms.length;i++){
      var s = syms[i];
      var ovx = Math.min(it.b.x2, s.b.x2) - Math.max(it.b.x, s.b.x);
      if(ovx <= 0.45*Math.min(it.b.w, s.b.w)) continue;
      var ovy = Math.min(it.b.y2, s.b.y2) - Math.max(it.b.y, s.b.y);
      if(ovy > 0 || (isFlatBox(it.b) && isFlatBox(s.b)) || -ovy < 0.12*refH){
        s.items.push(it); s.b = unionBox(s.b, it.b); return;
      }
    }
    syms.push({items:[it], b:it.b});
  });
  syms.sort(function(a,b){ return a.b.x - b.b.x; });

/* strokes to classified symbols */
function buildSymbols(){
  var ink = S.strokes.filter(function(st){ return !st.hl; });
  if(!ink.length) return [];
  var items = ink.map(function(st){ return {st:st, b:boxOf([st])}; });
  var out = [];
  clusterRows(items).forEach(function(L){
    var refH = boxHeights(L.items);
    var syms = assembleSymbols(L.items, refH);
    fuseEquals(syms, refH);
    refH = boxHeights(syms);
    syms.forEach(function(s){
      var c = classify(s, refH);
      s.ch = c.ch; s.alts = c.list || []; s.firm = !!c.firm; s.xshape = !!c.xshape;
      out.push(s);
    });
  });

}
/* one side of a candidate fraction bar: the nearest cluster of symbols centred on it */
function fracSide(syms, bar, dir){
  var x1 = bar.x - bar.w*0.2, x2 = bar.x2 + bar.w*0.2, cands = [];
  syms.forEach(function(s){
    if(s.used || s.isBar) return;
    var c = (s.b.x + s.b.x2)/2;
    if(c < x1 || c > x2) return;
    var gap = dir < 0 ? (bar.y - s.b.y2) : (s.b.y - bar.y2);
    if(gap < 0) return;
    cands.push({s:s, gap:gap, h:s.b.h});

  list.sort(function(a,b){ return a.b.x - b.b.x; });
  var box = list[0].b;
  list.forEach(function(s){ box = unionBox(box, s.b); });

  if(bar.w < box.w*0.85) return null;

function buildFractions(syms){

  bars.sort(function(a,b){ return a.b.w - b.b.w; });
  bars.forEach(function(B){
    if(B.used) return;
    var num = fracSide(syms, B.b, -1);
    if(!num) return;
    var den = fracSide(syms, B.b, 1);
    if(!den) return;
    var node = {
      frac:true, num:num.list, den:den.list, ch:'#', items:[],
      b: unionBox(unionBox(B.b, num.box), den.box)

    num.list.concat(den.list).forEach(function(s){ s.used = true; });
    B.used = true;
    syms.push(node);
  });

}
function setAnchor(grp){
  grp.lineH = refHeight(grp.symbols);
  var hasFrac = grp.symbols.some(function(s){ return s.frac; });
  var eq = null;
  grp.symbols.forEach(function(s){ if(!s.frac && s.ch === '=') eq = s; });
  if(hasFrac && eq){ grp.baseline = (eq.b.y + eq.b.y2)/2 + grp.lineH*0.5; return; }
  var bases = grp.symbols.filter(function(s){ return !s.frac && s.b.h > 0.5*grp.lineH; })
    .map(function(s){ return s.b.y2; }).sort(function(a,b){ return a-b; });

function segment(){

  clusterRows(syms).forEach(function(L){
    var items = L.items;
    if(!items.length) return;
    var refH = refHeight(items);
    var cur = [], mine = [];
    function flush(){
      if(!cur.length) return;
      var box = cur[0].b;
      cur.forEach(function(s){ box = unionBox(box, s.b); });
      mine.push({symbols:cur, box:box, lineH:refH, baseline:box.y2, nextX:Infinity});
      cur = [];
    }
    for(var i=0;i<items.length;i++){
      if(cur.length && items[i].b.x - cur[cur.length-1].b.x2 > 1.7*refH) flush();
      cur.push(items[i]);
    }
    flush();
    for(var k=0;k<mine.length;k++){

/* ---------------- layout: symbols to expression ---------------- */
function altNonLetter(s){
  var list = s.alts || [];
  for(var i=0;i<list.length;i++){
    if(LETTERS.indexOf(list[i].ch) < 0 && list[i].score > 0.45) return list[i].ch;
  }
  return '?';
}
/* letters only survive where they make sense: as the name being defined, or once defined elsewhere.

function resolveSeq(items, env, assignHead){
  var chs = items.map(function(s){ return s.frac ? '#' : s.ch; });
  for(var i=0;i<items.length;i++){
    var s = items[i];
    if(s.frac){ resolveSeq(s.num, env, false); resolveSeq(s.den, env, false); continue; }
    var ch = s.ch, prev = chs[i-1] || '', next = chs[i+1] || '';
    if(s.xshape){
      if(/[0-9.)]/.test(prev) && /[0-9.(#]/.test(next)) ch = '*';
      else if(assignHead && i === 0) ch = 'x';
      else if(env && env.x !== undefined) ch = 'x';
      else ch = '*';
    } else if(ch.length === 1 && LETTERS.indexOf(ch) >= 0){
      var keep = (assignHead && i === 0) || (env && env[ch] !== undefined);
      if(!keep) ch = altNonLetter(s);

function canSup(s, base, refH){
  if(!base) return false;
  var ch = s.frac ? '#' : s.rch;
  if(!s.frac && !/^[0-9a-z.()]$/.test(ch)) return false;
  if(s.b.h > base.h*0.85) return false;
  if(s.b.y2 > base.y + base.h*0.62) return false;
  if(s.b.x < base.x2 - base.w*0.25) return false;

function wrapIf(d){ return /[+\-*\/^]/.test(d) ? '(' + d + ')' : d; }

    }
    if(s.frac){
      var nu = buildExpr(s.num, refHeight(s.num)), de = buildExpr(s.den, refHeight(s.den));

      disp += wrapIf(nu.disp) + '/' + wrapIf(de.disp);

function parseGroup(grp, env){

function measureDigitRatio(){
  try{
    var g = document.createElement('canvas').getContext('2d');
    g.font = '700 100px Caveat, cursive';
    var m = g.measureText('8');
    if(m.actualBoundingBoxAscent) DIGIT_RATIO = (m.actualBoundingBoxAscent + (m.actualBoundingBoxDescent || 0)) / 100;
  }catch(e){}
  if(!(DIGIT_RATIO > 0.2 && DIGIT_RATIO < 1.2)) DIGIT_RATIO = 0.52;
}

/* ---------------- solve ---------------- */
function place(grp, text, mark){
  var h = grp.lineH, size = h / DIGIT_RATIO;
  var x = grp.box.x2 + h*0.45, baseline = grp.baseline;
  var width = mark === 'ok' ? h*0.95 : 0;
  if(text){
    ctx.save();
    ctx.font = '700 ' + size + 'px Caveat, "Segoe Script", cursive';
    var m = ctx.measureText(text);
    /* handwriting faces overhang their advance width, so trust the ink box when it is there */
    var ink = m.actualBoundingBoxRight !== undefined ? Math.max(m.width, m.actualBoundingBoxRight) : m.width;
    width += ink*1.04 + 4 + (mark === 'bad' ? h*0.9 : 0);
    ctx.restore();
  }
  var room = Math.min(grp.nextX, W) - x - h*0.25;
  if(width > room){
    baseline += h*1.3;
    x = Math.max(4, Math.min(x, W - width - 6));

var autoT = 0;
function scheduleAuto(){
  if(!S.auto) return;

}
function sameEnv(a, b){
  var ka = Object.keys(a), kb = Object.keys(b);
  if(ka.length !== kb.length) return false;
  for(var i=0;i<ka.length;i++) if(a[ka[i]] !== b[ka[i]]) return false;
  return true;
}
function solve(){
  buildTemplates();
  var groups = segment(), parsed = [], env = {};
  for(var round=0; round<4; round++){
    parsed = groups.map(function(g){ return parseGroup(g, env); });
    var next = {};
    parsed.forEach(function(p){
      if(!p || !p.assign) return;
      var v = calc(p.rhs, env);
      if(v.ok) next[p.assign] = v.value;
    });
    if(sameEnv(next, env)) break;
    env = next;
  }
  var answers = [], read = [];
  parsed.forEach(function(p){
    if(!p) return;
    if(p.assign){
      if(env[p.assign] !== undefined) read.push(p.assign + ' = ' + fmt(env[p.assign]));
      return;
    }
    if(!/[0-9a-z]/.test(p.lhs)) return;
    var res = calc(p.lhs, env);
    if(!res.ok){
      if(res.err && res.err.indexOf('non conosco') === 0) read.push(p.dispL + '= ?');
      return;
    }
    var text = fmt(res.value);
    if(p.rhs.replace(/\s/g, '')){
      var ru = calc(p.rhs, env);
      if(!ru.ok) return;
      if(Math.abs(ru.value - res.value) <= 1e-9*Math.max(1, Math.abs(res.value))) answers.push(place(p.grp, '', 'ok'));
      else answers.push(place(p.grp, text, 'bad'));
    } else answers.push(place(p.grp, text, 'val'));
    read.push(p.dispL + '= ' + text);
  });

  cacheDirty = true; render(); save();
}
function updateHint(list){
  if(!hintEl) return;
  if(!list || !list.length){ hintEl.innerHTML = TIP; hintEl.hidden = S.strokes.length > 0; return; }
  hintEl.hidden = false;
  var keep = W < 560 ? 1 : 3;
  hintEl.innerHTML = '<b>Ho letto</b> ' + list.slice(-keep).map(function(x){
    return '<code>' + x.replace(/\*/g, '×') + '</code>';
  }).join(' · ');
}
/* ---------------- export ---------------- */
var DL = null;
function exportPNG(){
  var s = 2, c = document.createElement('canvas');
  c.width = Math.round(W*s); c.height = Math.round(H*s);
  var g = c.getContext('2d');
  g.scale(s, s);
  g.fillStyle = PAL.paper; g.fillRect(0,0,W,H);
  g.lineWidth = 1;
  var step;
  for(step = 24; step <= 120; step += 96){
    g.strokeStyle = step === 24 ? PAL.grid : PAL.grid2;
    g.beginPath();
    for(var x=0;x<W;x+=step){ g.moveTo(Math.round(x)+0.5, 0); g.lineTo(Math.round(x)+0.5, H); }
    for(var y=0;y<H;y+=step){ g.moveTo(0, Math.round(y)+0.5); g.lineTo(W, Math.round(y)+0.5); }
    g.stroke();
  }
  S.strokes.forEach(function(st){ if(st.hl) drawStroke(g, st); });
  S.strokes.forEach(function(st){ if(!st.hl) drawStroke(g, st); });
  S.answers.forEach(function(a){ drawAnswer(g, a); });
  c.toBlob(function(blob){
    if(!blob) return;
    if(DL){
      DL.save({filename:'quadretti.png', data:blob}).then(function(){ toast('Lavagna salvata'); })
        .catch(function(err){ if(err && err.code !== 'declined') toast('Non riesco a salvare il PNG'); });
      return;
    }
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'quadretti.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    toast('Lavagna salvata');
  }, 'image/png');
}

    document.querySelectorAll('.sz').forEach(function(o){ o.setAttribute('aria-pressed', String(o === b)); });
  });
});
var TIP = hintEl ? hintEl.innerHTML : '';
$('#solveBtn').addEventListener('click', function(){
  var before = S.answers.length;
  solve();
  if(!S.answers.length) toast(before ? 'Nessun conto da risolvere' : 'Non ho trovato righe con l\'uguale');
});
$('#undoBtn').addEventListener('click', undo);
$('#redoBtn').addEventListener('click', redo);
$('#exportBtn').addEventListener('click', exportPNG);
$('#autoBtn').addEventListener('click', function(){
  S.auto = !S.auto;
  $('#autoBtn').setAttribute('aria-pressed', String(S.auto));
  if(S.auto) solve();
});
$('#clearBtn').addEventListener('click', function(){
  if(!S.strokes.length) return;
  if(!confirm('Svuoto la lavagna? Puoi annullare con Ctrl+Z.')) return;
  pushHistory();
  S.strokes = []; S.answers = [];
  cacheDirty = true; render(); save();
});
document.addEventListener('keydown', function(e){
  var mod = e.ctrlKey || e.metaKey;
  if(mod && e.key.toLowerCase() === 'z'){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); return; }
  if(mod && e.key.toLowerCase() === 'y'){ e.preventDefault(); redo(); return; }
  if(mod && e.key === 'Enter'){ e.preventDefault(); solve(); return; }
  if(mod) return;
  var k = e.key.toLowerCase();
  if(k === 'p') setTool('pen');
  else if(k === 'h') setTool('hl');
  else if(k === 'g' || k === 'e') setTool('eraser');
});

/* ---------------- init ---------------- */
var DEMO = [
  [[0,0],[0,20],[0,40],[0,60]],
  [[30,16],[38,3],[52,0],[63,10],[58,26],[42,42],[30,60],[66,60]],
  [[90,32],[110,32],[132,32]],
  [[111,11],[111,32],[111,53]],
  [[148,2],[170,2],[192,2],[178,30],[166,60]],
  [[214,24],[234,24],[252,24]],
  [[214,43],[234,43],[252,43]]
];
function seed(){
  var ox = Math.max(24, Math.min(W*0.14, 240)), oy = Math.max(60, Math.min(H*0.24, 210));
  /* shrink the example on a narrow board, leaving room for the answer */
  var s = Math.min(1, (W - ox - Math.max(90, W*0.3)) / 252);
  if(s < 0.45) return;
  DEMO.forEach(function(path){
    S.strokes.push({
      id:nid(), color:'ink', w:3, hl:0,
      pts:path.map(function(q){ return {x:ox + q[0]*s, y:oy + q[1]*s}; })
    });
  });
  cacheDirty = true;
}
var bootTries = 0, booted = false;
function boot(){
  if(booted) return;
  resize();
  if(!W){ if(bootTries++ < 200) setTimeout(boot, 40); return; }
  booted = true;
  if(!load()) seed();
  render();
  measureDigitRatio();
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){
      measureDigitRatio();
      setTimeout(function(){ buildTemplates(); if(S.strokes.length) solve(); }, 0);
    });
  } else {
    setTimeout(function(){ buildTemplates(); if(S.strokes.length) solve(); }, 300);
  }
}
boot();
if(window.claude && window.claude.use){
  window.claude.use('downloads').then(function(d){ if(d){ DL = d; $('#exportBtn').hidden = false; } }).catch(function(){});
} else {
  $('#exportBtn').hidden = false;
}
})();
</script>
